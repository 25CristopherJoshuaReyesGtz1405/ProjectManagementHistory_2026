name: SIGAH Backend CI - Zero-Trust & Unit Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    name: Compilación ESM y Pruebas Unitarias (Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias limpias
        run: npm ci

      - name: Verificar compilación TypeScript
        run: npm run build

      - name: Ejecutar Suite de Pruebas Unitarias
        run: npx vitest run src/app/app.controller.spec.ts src/Academico/ModuloExpediente/ExpedienteService.spec.ts src/Academico/Test/TitulacionSmartContract.spec.ts src/Academico/Test/ConcurrencyStress.spec.ts src/ArchivoFisico/Pipes/ValidadorFirmaArchivoPipe.spec.ts